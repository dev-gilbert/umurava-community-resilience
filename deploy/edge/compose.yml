services:
  edge-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${EDGE_DB_NAME:-umurava_edge}
      POSTGRES_USER: ${EDGE_DB_USER:-umurava_edge}
      POSTGRES_PASSWORD: ${EDGE_DB_PASSWORD:?Set EDGE_DB_PASSWORD in deploy/edge/.env.edge}
    volumes:
      - umurava-edge-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${EDGE_DB_USER:-umurava_edge} -d ${EDGE_DB_NAME:-umurava_edge}"]
      interval: 5s
      timeout: 3s
      retries: 20
  edge-api:
    build: ../../backend/core-api
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://edge-postgres:5432/${EDGE_DB_NAME:-umurava_edge}
      SPRING_DATASOURCE_USERNAME: ${EDGE_DB_USER:-umurava_edge}
      SPRING_DATASOURCE_PASSWORD: ${EDGE_DB_PASSWORD:?Set EDGE_DB_PASSWORD in deploy/edge/.env.edge}
      UMURAVA_JWT_SECRET: ${EDGE_JWT_SECRET:?Set EDGE_JWT_SECRET in deploy/edge/.env.edge}
      UMURAVA_JWT_ISSUER: ${EDGE_JWT_ISSUER:-umurava-edge}
      UMURAVA_CORS_ORIGINS: ${EDGE_CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "${EDGE_BIND_ADDRESS:-127.0.0.1}:${EDGE_API_PORT:-8081}:8080"
    depends_on:
      edge-postgres:
        condition: service_healthy
  edge-sync-agent:
    profiles: ["sync"]
    build: ../../services/edge-sync-agent
    restart: unless-stopped
    environment:
      CLOUD_API_URL: ${CLOUD_API_URL:?Set CLOUD_API_URL}
      CLOUD_ACCESS_TOKEN: ${CLOUD_ACCESS_TOKEN:-}
      CLOUD_REFRESH_TOKEN: ${CLOUD_REFRESH_TOKEN:?Set CLOUD_REFRESH_TOKEN}
      EDGE_API_URL: http://edge-api:8080
      EDGE_ACCESS_TOKEN: ${EDGE_ACCESS_TOKEN:-}
      EDGE_REFRESH_TOKEN: ${EDGE_REFRESH_TOKEN:?Set EDGE_REFRESH_TOKEN}
      SYNC_COMMUNITY_ID: ${SYNC_COMMUNITY_ID:?Set SYNC_COMMUNITY_ID}
      SYNC_DEVICE_ID: ${SYNC_DEVICE_ID:?Set SYNC_DEVICE_ID}
      SYNC_POLL_SECONDS: ${SYNC_POLL_SECONDS:-10}
      SYNC_STATE_PATH: /state/edge-sync.sqlite3
    volumes:
      - umurava-edge-sync-state:/state
    depends_on:
      edge-api:
        condition: service_started
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["monitoring"]
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - umurava-edge-prometheus:/prometheus
    ports:
      - "127.0.0.1:${EDGE_PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - edge-api
  grafana:
    image: grafana/grafana:12.1.0
    profiles: ["monitoring"]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in deploy/edge/.env.edge}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - umurava-edge-grafana:/var/lib/grafana
    ports:
      - "127.0.0.1:${EDGE_GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus
volumes:
  umurava-edge-postgres:
  umurava-edge-prometheus:
  umurava-edge-grafana:
  umurava-edge-sync-state:

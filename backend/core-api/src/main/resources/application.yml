server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
spring:
  application:
    name: umurava-core-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/umurava}
    username: ${SPRING_DATASOURCE_USERNAME:umurava}
    password: ${SPRING_DATASOURCE_PASSWORD:umurava}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
management:
  endpoints:
    web:
      exposure:
        include: health,info
umurava:
  cors:
    allowed-origins: ${UMURAVA_CORS_ORIGINS:http://localhost:3000}
  jwt:
    secret: ${UMURAVA_JWT_SECRET:local-only-change-this-development-secret-32-bytes-minimum}
    issuer: ${UMURAVA_JWT_ISSUER:umurava-local}
    expiration-minutes: ${UMURAVA_JWT_EXPIRATION_MINUTES:10}

name: UMURAVA CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: umurava
          POSTGRES_USER: umurava
          POSTGRES_PASSWORD: ci-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U umurava -d umurava"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test API
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/umurava
          SPRING_DATASOURCE_USERNAME: umurava
          SPRING_DATASOURCE_PASSWORD: ci-password
          UMURAVA_JWT_SECRET: ci-only-secret-should-never-be-used-outside-ci-123456
        run: mvn -B -f backend/core-api/pom.xml test
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package.json
      - name: Install web dependencies
        working-directory: apps/web
        run: npm install
      - name: Build web
        working-directory: apps/web
        run: npm run build
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: flutter pub get
      - name: Analyze mobile
        working-directory: apps/mobile
        run: flutter analyze
